Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${self:custom.ordersTable}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  CatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${self:custom.catalogTable}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  OrdersTableArn:
    Value: !GetAtt OrdersTable.Arn
  CatalogTableArn:
    Value: !GetAtt CatalogTable.Arn
  OrdersTableName:
    Value: ${self:custom.ordersTable}
  CatalogTableName:
    Value: ${self:custom.catalogTable}
